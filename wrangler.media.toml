name = "reelnova-media"
main = "workers/media-worker.mjs"
compatibility_date = "2026-08-01"
workers_dev = true
routes = [
  { pattern = "media.iseedrama.com", custom_domain = true }
]

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "reelnova-media-private"

[vars]
APP_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000,https://iseedrama.com,https://www.iseedrama.com,https://admin.iseedrama.com"
APP_BASE_URL = "https://iseedrama.com"
PUBLIC_BASE_URL = "https://media.iseedrama.com"
R2_ACCOUNT_ID = "d054d2b69107e72e33c27bc0501d166d"
R2_BUCKET_NAME = "reelnova-media-private"

[triggers]
crons = ["17 * * * *"]

# Configure as encrypted Worker secrets:
# MEDIA_WORKER_SECRET
# CLOUDFLARE_ACCOUNT_ID
# CLOUDFLARE_API_TOKEN (Account / Stream / Edit)
# R2_ACCOUNT_ID (required for browser direct multipart uploads)
# R2_ACCESS_KEY_ID (R2 S3 API token access key)
# R2_SECRET_ACCESS_KEY (R2 S3 API token secret key)
# R2_BUCKET_NAME (usually reelnova-media-private)
