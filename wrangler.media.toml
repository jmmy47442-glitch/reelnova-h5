name = "reelnova-media"
main = "workers/media-worker.mjs"
compatibility_date = "2026-08-01"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "reelnova-media-private"

[vars]
APP_ORIGINS = "http://localhost:3000,https://www.reelnova.com"
PUBLIC_BASE_URL = "https://media-upload.reelnova.workers.dev"

# Configure as encrypted Worker secrets:
# MEDIA_WORKER_SECRET
# CLOUDFLARE_ACCOUNT_ID
# CLOUDFLARE_API_TOKEN
